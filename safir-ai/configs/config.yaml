# =============================================================================
# SAFIR - Saha Analiz ve Farkindalik Icin Yapay Zeka Destekli Karar Sistemi
# Merkezi Konfigurasyon Dosyasi
#
# Bu dosya, mimarinin tum katmanlarinin (Adaptive Sampler, VLM, LLM/Agent,
# API/vLLM servisleri) davranisini tek bir noktadan yonetir.
# =============================================================================

# -----------------------------------------------------------------------------
# 00 - Uygulama Kimligi & Mock Mod Anahtarlari
# -----------------------------------------------------------------------------
# use_mock_vlm / use_mock_llm: true yapildiginda src/vlm/factory.py gercek
# vLLM GPU servislerine hic baglanmadan sahte (mock) istemcileri dondurur.
# GPU'su olmayan gelistiriciler bunlari kendi ortamlarinda/local config
# kopyalarinda true'ya cevirerek tum pipeline'i uctan uca test edebilir.
# Repo varsayilani, mevcut GPU/vLLM tabanli production akisini korumak icin
# false'tur.
app:
  name: "SAFIR"
  version: "2.0.0"
  use_mock_vlm: false
  use_mock_llm: false

system:
  name: "SAFIR"
  environment: "production"          # development | staging | production
  device: "cuda"                     # cuda | cpu
  cuda_device_index: 0
  log_level: "INFO"
  random_seed: 42

# -----------------------------------------------------------------------------
# 02 - VLM Oncesi Katman (Adaptive Frame Sampler) - CPU ONLY
# -----------------------------------------------------------------------------
sampler:
  # --- AdaptiveFrameSampler tarafindan aktif olarak kullanilan parametreler ---
  # KANITA DAYALI DEGISIKLIK (0.001 -> 0.0005 -> 0.00025): kullanicidan
  # gelen ek geri bildirim - "bazen cok uzun araliklarda frame alamiyorum
  # VE kritik kisa anlari da alamiyorum" - AYNI ANDA GORULUYOR; bu ikilinin
  # birlikte gorulmesi, `min_change_threshold`in (dolayisiyla ondan
  # TURETILEN TUM oranli esiklerin: `early_change_score_ratio`,
  # `dedup_similarity_ratio`, `single_frame_change_noise_floor_ratio`)
  # GERCEK sahne hareketini bile bastiracak kadar yuksek olabilecegine
  # isaret eder. Ilk turda yariya indirildi (0.001 -> 0.0005); kullanici
  # "daha da hassas olabilir" diyerek AYNI yonde devam istedi, bu yuzden
  # BIR KEZ DAHA yariya indirildi (0.0005 -> 0.00025). TUM oranli alt-
  # esikler yine OTOMATIK olarak ayni oranda duser - ayrica dokunulmadi.
  # ONEMLI (birikimli risk uyarisi - guncellendi): kullanici "biraz daha
  # oynayalim" diyerek AYNI yonde bir adim daha istedi; bu kez BUTUN
  # yariya-indirme yerine daha OLCULU bir adim atildi (0.00025 -> 0.00015,
  # ~1.7x) - esik artik ILK degerin (0.001) ~1/6.7'si. False-positive riski
  # bu noktada ARTIK KUCUMSENMEMELI; bir SONRAKI adim icin gercek
  # diagnostic veri/video KESINLIKLE onerilir (kor tahminle daha fazla
  # ILERLEMEK, "hicbir sey kacirilmasin" ugruna "her sey evidence sayilsin"a
  # cok yaklasabilir). Operator panelindeki `min_change_threshold_override`
  # slider'i ile sahne bazinda GERI yukseltilebilir (bkz. `sampler_from_config`).
  # KANITA DAYALI DEGISIKLIK (0.00015 -> 0.0001): "5 saniye boyunca hic
  # cikti alinmiyor" geri bildirimi - bu, ASIL olarak `max_temporal_gap_
  # sec`in kendisiyle (asagida 7.0 -> 4.0) DUZELTILECEK bir sikayettir
  # (coverage guvenlik agi zaten en fazla `max_temporal_gap_sec` kadar
  # sessizlige izin veriyordu - "5 saniye" bunun ICINDE, bir hata degil).
  # Yine de piksel esigi de biraz daha dusuruldu ki gercek ama zayif bir
  # sinyal, coverage'in "hicbir sey secilmedi" bekleme suresini SIFIRLAYAN
  # bir esik/erken-degisim/single-frame karesi olarak DAHA SIK yakalansin.
  # KANITA DAYALI DEGISIKLIK (0.0001 -> 0.00008): kullanicidan "cok az daha
  # hassasiyet" talebi - KUCUK, olculu bir adim (onceki turlardaki tam
  # yariya indirmelerin cok altinda, ~%20 dusus). Esik artik ilk degerin
  # (0.001) 1/12.5'i - bu noktadan sonraki EK dususler icin GERCEK
  # diagnostic veri/video onerilir, kor tahmin degil.
  min_change_threshold: 0.00008      # Kanit Karesi sayilmasi icin gurultu-tabani-dusulmus min degisim orani (yuksek hassasiyet)
  blur_kernel_size: [21, 21]         # Gauss bulaniklastirma cekirdek boyutu (tek sayilar)
  # KANITA DAYALI DEGISIKLIK (30 -> 60): `sample_fps` 5'ten 10'a
  # cikarildiginda (asagisi), `history_window` SABIT KALDIGI icin adaptif
  # gurultu tabaninin (medyan) baktigi GERCEK sure 6 saniyeden 3 saniyeye
  # YARIYA DUSTU (30 ornek / 5fps = 6s idi; 30 ornek / 10fps = 3s oldu).
  # Daha kisa bir pencere, gercek/surdurulen bir hareketi DAHA HIZLI "yeni
  # normal" (gurultu) sayip net_change_score'u bastirir - hem "uzun
  # bosluk" hem "kisa an kacirma" sikayetlerine KATKIDA bulunabilecek bir
  # yan etkidir. 60'a cikarilarak eski 6 saniyelik pencere (60 ornek /
  # 10fps = 6s) GERI getirildi - sample_fps degisikliginin DIGER
  # parametreleri sessizce kaydirmasi onlendi.
  # KANITA DAYALI DEGISIKLIK (60 -> 90 -> 180): `sample_fps` her artiginda
  # (10 -> 15 -> 30) ORANTILI olarak buyutuldu - GERCEK 6 saniyelik
  # gurultu-tabani penceresini korur (180 ornek / 30fps = 6s, oncekiyle
  # AYNI); aksi halde sample_fps artisi bu pencereyi sessizce daraltirdi.
  history_window: 180                # Dinamik gurultu tabani (medyan) icin tutulan kare gecmisi
  # KANITA DAYALI DEGISIKLIK (5 -> 10 -> 15 -> 30): kullanici "kritik anlik
  # kareleri kacirmaya devam ediyoruz" dedi - `15` degeri yalnizca 25fps'lik
  # bir KAYNAK icin native (`frame_step=int(25/15)=1`) hiz veriyordu;
  # GERCEK saha kameralari genellikle 30fps (yaygin varsayilan, PAL/NTSC
  # standartlarindan) veya daha yuksek calisiyorsa, `frame_step=
  # int(native_fps/sample_fps)` HALA 2 (veya daha buyuk) cikip HER IKI
  # karede birini atlamaya devam ediyor olabilirdi - bu, `threshold_
  # exceeded` yolunun kosulsuzlugu DAHIL, secim mantigindaki HICBIR ayarla
  # duzeltilemeyen, TAMAMEN taban tarama hizina bagli bir kor pencere
  # kaynagidir (bkz. onceki tur notlari). `30`, YAYGIN kaynak hizlarinin
  # (25/30fps) TAMAMI icin `frame_step=1` (native, atlamasiz okuma)
  # garantiler; yalnizca 60fps gibi DAHA NADIR yuksek-hizli kaynaklarda
  # hala `frame_step=2` (~33ms kor pencere, oncekinden cok daha kucuk)
  # kalir. CPU maliyeti (hafif OpenCV gri-tonlama+fark islemi, GPU'suz)
  # ilk turdaki (5) degere gore ~6x artar - bu, videonun HER TEK native
  # karesini islemenin dogal maliyetidir (25/30fps kaynaklar icin daha
  # ILERI gidilemez, `frame_step` zaten 1'in altina inemez); secim
  # mantigindaki HICBIR deger degismez. GERCEK kaynak fps'i (25/30'dan
  # FARKLI, ör. 60) biliniyorsa bu deger ona gore GERI ayarlanabilir -
  # amac her zaman `frame_step<=1` (mumkunse tam native hiz) saglamaktir.
  sample_fps: 30                      # Videonun kac saniyede bir kare kontrol edilecegini belirleyen hiz

  # NOT (mimari): Sampler artik hicbir OLAY KUMELEMESI yapmaz (eski
  # min_event_interval_sec/cluster_merge_gap_sec/bbox_iou_merge_threshold/
  # max_cluster_duration_sec KALDIRILDI). Kanit Karesi sayisinda sabit bir
  # ust sinir da YOKTUR (eski max_evidence_buffer KALDIRILDI): esik-gecmis
  # TUM kareler VLM'e gonderilir. Kumeleme + istek boyutu kontrolu artik
  # vlm.batch_size ile VLM katmaninda yapilir (bkz. src/vlm/base_vlm.py).
  temporal_vote_window: 1            # Zamansal oylama penceresi (kare)
  temporal_vote_min_count: 1         # Bir olayin gecerli sayilmasi icin gereken min oy

  # NOT (zamansal kapsama): Esigi hicbir zaman gecemeyen uzun sessiz
  # araliklarda (ör. 00:15 -> 01:45) sistemin kor kalmasini onleyen guvenlik
  # agi. Kumeleme DEGILDIR, pre/peak/post rolu getirmez (bkz.
  # EvidenceFrame.selection_reason="temporal_coverage"). Bu, EN SEYREK secim
  # araligidir (sakin bolge) - erken/guclu degisimde daha sik secilir.
  # KANITA DAYALI DEGISIKLIK (15.0 -> 10.0): evidence kare sayisini artirma
  # talebi - sakin bolgedeki "en seyrek" araligi kisaltmak, VLM'e giden
  # temsili kare yogunlugunu (kumeleme/esik mantigina DOKUNMADAN) genel
  # olarak artirir; ayni zamanda "uzun bosluk" HISSINI de azaltir. `10.0`,
  # asagidaki `early_change_selection_interval_sec` (2.0) <= `max_temporal_
  # gap_sec` sirasini hala korur (constructor bu sirayi dogrular).
  # KANITA DAYALI DEGISIKLIK (10.0 -> 7.0): "daha sik frame" talebiyle
  # devam - sakin bolge araligi bir kademe daha kisaltildi.
  # KANITA DAYALI DEGISIKLIK (7.0 -> 4.0): kullanicidan gelen "bazen 5
  # saniye boyunca hic cikti almiyoruz, en kritik anlari kacirmayalim"
  # geri bildirimi - bu, DOGRUDAN bu degerle sinirli. 4.0, sessiz/sakin
  # bolgelerde bile en fazla 4 saniyelik bir bosluk garantiler.
  max_temporal_gap_sec: 4.0          # Son evidence karesinden bu yana izin verilen azami sessizlik suresi (saniye)

  # NOT (yogunluk-uyarlamali secim): Kaynak/analiz FPS'i (sample_fps) HER
  # ZAMAN sabittir - adaptif olan yalnizca VLM'e gonderilecek karelerin secim
  # SIKLIGIDIR. Ana esik gecilmeden ONCE baslayan kucuk-ama-surekli
  # degisimler (ör. izmarit atma ani, hafif dumanin ilk gorulme ani) icin
  # daha sik secim yapilir; ana esik gecildikten sonra bir hysteresis
  # penceresinde secim daha da siklastirilir. Kumeleme/olay baslangic-bitis
  # zamani uretimi DEGILDIR (bkz. EvidenceFrame.selection_reason=
  # "early_change"/"significant_change").
  early_change_score_ratio: 0.4      # net_change_score >= bu_oran * min_change_threshold ise "supheli-erken"
  early_change_window: 3             # Erken-degisim onayinda dikkate alinan son karar sayisi (sabit boyut)
  early_change_min_count: 2          # Onay icin gereken min "supheli-erken" karar sayisi (tek sicramayi eler)
  # KANITA DAYALI DEGISIKLIK (3.0 -> 2.0): erken-degisim (onaylanmis, henuz
  # ana esigi gecmemis) durumdayken uygulanan azami secim araligi
  # kisaltildi - bir onceki turda eklenen "yaklasma penceresi" ek-kare
  # mekanizmasi da AYNI degeri kullaniyor (bkz. adaptive_sampler.py), yani
  # bu tek deger HEM onay-oncesi HEM onay-sonrasi erken-durumda VLM'e giden
  # kare yogunlugunu artirir.
  # KANITA DAYALI DEGISIKLIK (2.0 -> 1.5): "daha sik frame" talebiyle devam.
  # KANITA DAYALI DEGISIKLIK (1.5 -> 1.0): "en kritik anlari kacirmayalim"
  # talebiyle devam - erken-degisim durumundaki azami secim araligi
  # kisaltildi (bkz. `max_temporal_gap_sec` yorumu, ayni gerekce).
  early_change_selection_interval_sec: 1.0  # Erken-degisimde azami secim araligi (sakin moddan daha sik)
  early_change_cooldown_sec: 4.0     # Erken-degisim sinyali kesildikten sonra sakin moda donmeden once beklenen sure

  # KANITA DAYALI DEGISIKLIK (1.0 -> 0.5): ana esik gecildikten sonraki EN
  # SIK secim araligi kisaltildi - guclu/dogrulanmis bir olayin GELISEN
  # asamalarindan (esik-alti kalan ama hysteresis penceresindeki) daha COK
  # temsili kare yakalanir. `threshold_exceeded` kareler zaten kosulsuz/
  # sinirsiz secildigi icin bu deger yalnizca ARADAKI esik-alti kareleri
  # etkiler - eklenen kareler halihazirda VAR OLAN "significant_change"
  # kategorisine girer, yeni bir kategori EKLENMEZ.
  # KANITA DAYALI DEGISIKLIK (0.5 -> 0.3): "daha sik frame" talebiyle devam.
  # KANITA DAYALI DEGISIKLIK (0.3 -> 0.2): "en kritik anlari kacirmayalim"
  # talebiyle devam - ana esik sonrasi hysteresis penceresindeki EN SIK
  # secim araligi daha da kisaltildi.
  significant_change_selection_interval_sec: 0.2  # Guclu-degisim hysteresis penceresinde azami secim araligi (en sik)
  strong_change_cooldown_sec: 4.0    # Ana esik gecildikten sonra "guclu degisim" durumunun korunacagi sure

  # NOT (duplicate onleme): Yalnizca coverage/early_change/significant_change
  # (esik-alti) secimlerine uygulanir; threshold_exceeded kareler ASLA
  # bu kontrolle elenmez.
  # KANITA DAYALI DEGISIKLIK (0.5 -> 0.35): esik-alti secimlerde "neredeyse
  # ayni" sayilip elenme sinirini daraltir (0.35*min_change_threshold, daha
  # KUCUK bir fark payi) - daha az agresif dedup, GORSEL OLARAK BIRBIRINE
  # yakin ama yine de farkli olan ardisik kareler artik daha az elenir; bu
  # da toplam evidence/VLM kare sayisini artiran DIGER bir kanal. threshold_
  # exceeded kareler zaten bu kontrolden HICBIR ZAMAN gecmiyor - etkilenmez.
  # KANITA DAYALI DEGISIKLIK (0.35 -> 0.25): "daha sik frame" talebiyle devam.
  # KANITA DAYALI DEGISIKLIK (0.25 -> 0.2): daha COK kare degerlendirme
  # talebiyle devam - dedup sinirini biraz daha daraltir (daha az agresif
  # eleme).
  dedup_similarity_ratio: 0.2        # Son secilen kareye gore fark orani bu_oran*min_change_threshold'dan dusukse "duplicate"

  # NOT (tek-kareli guclu/lokal degisim): early_change_min_count'un cok-kareli
  # onayindan BAGIMSIZ, ayri bir yol - ana esigin ALTINDA ama TEK bir karede
  # zaten guclu+lokal olan sinyalleri onay beklemeden yakalar.
  single_frame_change_enabled: true
  single_frame_change_noise_floor_ratio: 2.0   # skor >= bu_oran * max(adaptive_noise_floor, early_esik) ise "guclu"
  single_frame_change_max_area_ratio: 0.35     # hareket kutusu/kare alani bu orani asarsa "lokal degil" (elenir)

  # KOK NEDEN DUZELTMESI (regresyon): kullanicidan gelen geri bildirim -
  # "onceden yakalanan dusuk kontrastli/yavas gelisen bir olay baslangici
  # (ör. yaziciden ilk dumanin cikisi) artik kaciyor, yalnizca olay
  # guclendikten sonraki kareler seciliyor". `git diff` ile onceki/mevcut
  # config karsilastirildi: `min_change_threshold` DUSURULMUS olmasina
  # RAGMEN sorun buydu degil - as gecen turlarda `sample_fps` art arda
  # yukseltildikce (kisa/ani olaylari yakalamak icin, bkz. `sample_fps`
  # yorumu) ARDISIK ORNEKLER arasindaki gercek zaman farki kisaldi. Dusuk
  # kontrastli/kademeli buyuyen bir olayda (ör. duman), her ORNEK ARASI
  # gerceklesen degisim de o kadar KUCULDU ki (21x21 blur + sabit piksel-
  # fark esigi 25 ile birlesince) `raw_change_ratio` TAMAMEN SIFIRA dustu -
  # bu, `min_change_threshold` NE KADAR dusurulurse dusurulsun DUZELTILEMEZ,
  # cunku sorun ORAN degil, HAM sinyalin kendisinin kaybolmasidir (izole
  # test: `git diff` ONCESI TUM esik/interval degerleriyle ama YALNIZCA
  # `sample_fps=30` ile calistirildiginda ayni olay YINE kacirildi -
  # degisken `sample_fps`ti, esik degerleri degildi).
  #
  # Bu, "sample_fps'i geri dusur" ile DUZELTILMEDI (bu, gecen turlarda
  # kazanilan kisa/ani olay yakalama iyilestirmelerini GERI ALIRDI - gorev
  # kisiti "eski ayarlara tamamen donme"). Bunun yerine, ardisik-ornek
  # karsilastirmasina (`prev_gray`, sample_fps'e bagli, kisa/ani olaylar
  # icin DEGISTIRILMEDEN korunur) EK olarak, periyodik yenilenen DAHA UZUN
  # bazli bir referans karsilastirmasi eklendi (bkz.
  # `AdaptiveFrameSampler.process_video` - `long_baseline_*`). Bu, KUCUK-
  # AMA-BIRIKIMLI degisimin daha uzun bir zaman araliginda GORUNUR hale
  # gelmesini saglar; yalnizca esik-alti aday tespitini (`is_early_
  # suspicious`) etkiler, `threshold_exceeded` (kosulsuz secim) yoluna ASLA
  # dokunmaz. Yanlis-pozitif korumasi: yalnizca skor bir ONCEKI ornege gore
  # HALA ARTMAKTAYSA "supheli" sayilir (TEK seferlik bir sicrama/adim
  # DEGIL, SURDURULEN bir buyume) - bkz. kod yorumu.
  long_baseline_change_enabled: true  # false ile bu yol tamamen devre disi (eski davranisla BIREBIR ayni)
  long_baseline_interval_sec: 0.5     # hizli kanal: uzun-baz referansin yenilenme araligi (saniye)

  # IKINCI KANAL (kanita dayali ek iyilestirme): hizli kanal (0.5s) tek
  # basina COK yavas gelisen olaylari (ör. kademeli baslayan bir yangin,
  # dumanin cok yavas yayilmasi) yakalamaya yetmeyebilir - dogrudan olculdu:
  # 5x daha yavas buyuyen sentetik bir "duman" senaryosunda, yalnizca hizli
  # kanalla HICBIR early_change uretilmiyordu; 3.0s'lik bu ikinci kanal
  # eklendiginde ayni olay baslangictan (~1.7s gecikmeyle) yakalandi. AYNI
  # `is_early_suspicious`i besler (VEYA mantigiyla) - hizli kanalin veya
  # `threshold_exceeded` (kosulsuz secim) yolunun YERINE GECMEZ, TAMAMEN
  # BAGIMSIZ EK bir guvenlik agidir.
  long_baseline_slow_interval_sec: 3.0  # yavas kanal: ikinci, daha uzun bazli referansin yenilenme araligi (saniye)

  # NOT (tanilama/diagnostic): Varsayilan KAPALI - secim davranisini/
  # performansini DEGISTIRMEZ. Acildiginda her ornek kare icin tam karar
  # izini (skorlar, esikler, durum, secim/red nedeni) diske yazar; goruntu/
  # base64 veri ASLA loglanmaz. Kok neden analizi icindir.
  diagnostic_enabled: false          # true yapilirsa diagnostic CSV/JSONL uretilir
  diagnostic_output_dir: "outputs/diagnostics"  # Tanilama dosyalarinin yazilacagi klasor
  diagnostic_output_format: "jsonl"  # "jsonl" veya "csv"

  # --- Geriye donuk uyumluluk / alternatif sampler ince ayarlari ---
  idle_interval_sec: 2.0             # Sakin bolgelerde kare yakalama araligi (saniye/kare)
  active_fps: 5                      # Hareket/degisim anlarinda aktif ornekleme hizi (fps)
  noise_floor: 0.011                 # Piksel farki gurultu tabani
  motion_threshold: 0.02             # Hareket olarak kabul edilecek fark orani esigi
  scene_change_threshold: 0.15       # Sahne degisimi esigi
  resize_width: 640                  # Analiz oncesi kare kucultme genisligi (performans icin)
  warmup_frames: 30                  # Baslangicta arka plan modelini olusturmak icin kare sayisi

# -----------------------------------------------------------------------------
# 03 - Gorsel Dil Modeli (VLM) Katmani - GPU / vLLM
# -----------------------------------------------------------------------------
# =============================================================================
# AKTIF KURULUM (yerel / offline): RTX 5090 32 GB (Blackwell, sm_120)
#   VLM: Qwen/Qwen3.5-9B              -> vLLM FP8 (~9 GB agirlik, native gorsel destekli)    :8001
#   LLM: Qwen/Qwen3-4B-Instruct-2507  -> vLLM BF16 (~8 GB agirlik, metin-only, non-thinking)  :8003
#   Toplam ~17 GB agirlik + KV/aktivasyon -> tahmini 32 GB'de sigar (asagidaki NOT'a bakin).
#   API anahtari GEREKMEZ; tamamen local inference (sartname uyumlu).
#   vLLM servis baslatma komutlari icin bkz. KURULUM.md.
#
#   NOT (dogrulama gerekiyor, bu VM'de DAHA ONCE DENENMEMISTIR):
#   - VLM = Qwen3.5-9B: Qwen2.5-VL'in yerini alan, native multimodal bir aile
#     (16 Subat 2026'da duyuruldu — ayri bir "-VL" soneki YOK, gorsel destek
#     her boyuta yerlesik). vLLM >=0.17 gerektirir (bkz. requirements.txt).
#   - LLM = Qwen3-4B-Instruct-2507: Qwen3.5 DEGIL, bilerek daha olgun/kararli
#     duz Qwen3 ailesinden (Nisan 2025) — LLM rolu tamamen metin-only oldugu
#     icin Qwen3.5'in native-gorsel avantajina ihtiyac yok.
#   - Agirlik/VRAM rakamlari basit parametre-sayisi x byte hesabidir (guvenilir);
#     KV cache + aktivasyon dahil GERCEK toplam OLCULMEMISTIR. KURULUM.md Faz
#     1'deki izole `vllm serve Qwen/Qwen3.5-9B ...` testiyle once TEK BASINA
#     dogrulayin (`nvidia-smi` ile gercek VRAM'i okuyun); basarisiz olursa
#     `qwen` modellerini "Qwen/Qwen2.5-VL-7B-Instruct" / "Qwen/Qwen2.5-3B-
#     Instruct"ye geri alin (bkz. git gecmisi).
#
# GELISTIRME/TEST (opsiyonel): GPU'suz ortamda tum pipeline'i denemek icin
#   app.use_mock_vlm: true + app.use_mock_llm: true  (harici hicbir sey gerekmez)
# veya harici Gemini ile (yalnizca gelistirme; offline degildir):
#   vlm.active_model: "gemini" + llm.active_model: "gemini" + GEMINI_API_KEY.
# =============================================================================
vlm:
  active_model: "gemini"             # qwen | gemma | gemini  (VLMFactory tarafindan okunur) — AKTIF: gemini
  batch_size: 40                     # Tek VLM istegine dahil edilecek azami evidence karesi sayisi (kumeleme VLM'de yapilir; bkz. src/vlm/base_vlm.py)
  models:
    qwen:
      model_name: "Qwen/Qwen3.5-9B"   # native gorsel destekli; 32 GB'de vLLM FP8 ile
      vllm_host: "127.0.0.1"                        # tek makine: API + vLLM ayni host
      vllm_port: 8001
      max_new_tokens: 512
      temperature: 0.2
      top_p: 0.9
    gemma:
      model_name: "google/gemma-3-vision-instruct"
      vllm_host: "0.0.0.0"
      vllm_port: 8002
      max_new_tokens: 512
      temperature: 0.2
      top_p: 0.9
    gemini:                          # gecici TEST backend'i (harici API — offline degildir)
      provider: "gemini"
      model_name: "gemini-3.5-flash-lite"
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "GEMINI_API_KEY"
      max_new_tokens: 2048
      temperature: 0.2
      top_p: 0.9

# -----------------------------------------------------------------------------
# 04 - Hibrit Bellek ve Baglam Olusturucu - CPU ONLY
# -----------------------------------------------------------------------------
memory:
  sqlite:
    db_path: "data/events.db"
  embedding:
    provider: "gemini"                 # Google Gemini Embedding API (harici) - GEMINI_API_KEY gerektirir
    model_name: "gemini-embedding-001"
    output_dimensionality: 768
    device: "api"
    normalize_embeddings: true
    api_key_env: "GEMINI_API_KEY"
  faiss:
    index_path: "data/knowledge_base/index/faiss.index"
    embedding_model: "gemini-embedding-001"
    top_k: 5                           # RERANK SONRASI nihai sonuc sayisi
    candidate_k: 20                    # FAISS'ten cekilecek aday sayisi (rerank ONCESI)
    similarity_threshold: null
  reranker:
    enabled: true
    provider: "groq"                   # embedding'in Gemini kotasindan BAGIMSIZ, AYRI Groq kotasi
    model_name: "openai/gpt-oss-20b"
    candidate_k: 20
    top_k: 5
    score_threshold: 0.10              # bu skorun ALTINDAKI sonuclar ELENIR (0 sonuc GECERLIDIR)
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"

# -----------------------------------------------------------------------------
# 05 - Ajan ve Muhakeme Katmani (LangGraph) - GPU / vLLM
# -----------------------------------------------------------------------------
llm:
  active_model: "gemini"              # qwen3 | gemma3 | gemini | groq — AKTIF: gemini
  # NOT (groq denemesi): qwen/qwen3.6-27b (ve digger standart Groq ucret-
  # siz-katman modelleri, orn. gpt-oss-20b/120b) istek basina 8000 TPM
  # ("prompt + max_new_tokens") sinirina sahip. Bu ajanin RAG-zenginlestirilmis
  # istemi TEK BASINA ~5500+ token - max_new_tokens'i "dusunme" adimlarina
  # yetecek kadar artirmak (1024 -> 4096) siniri astirdi (413 "Request too
  # large"); dusurmek ise bos/gecersiz JSON'a donuyordu (400
  # json_validate_failed). Groq'un 70K TPM'li compound/compound-mini
  # modelleri KENDI ic arac-cagirma mekanizmalarina sahip - LangGraph'in
  # bind_tools'uyla CATISABILIR, denenmedi. Reranker/guard Groq'ta KALDI
  # (kucuk, JSON-only istemler - bu sinira YAKLASMIYORLAR).
  models:
    qwen3:                           # aktif model Qwen3-4B-Instruct-2507'dir (VLM'den (Qwen3.5) FARKLI aile — bilerek: olgun/kararli, metin-only, gorsele ihtiyaci yok)
      model_name: "Qwen/Qwen3-4B-Instruct-2507"   # non-thinking mod (<think> bloklari yok), Nisan 2025'ten beri olgun vLLM destegi
      vllm_host: "127.0.0.1"                     # tek makine: API + vLLM ayni host
      vllm_port: 8003
      max_new_tokens: 1024
      temperature: 0.1
    gemma3:
      model_name: "google/gemma-3-8b-it"
      vllm_host: "0.0.0.0"
      vllm_port: 8004
      max_new_tokens: 1024
      temperature: 0.1
    gemini:                          # gecici TEST backend'i (harici API — offline degildir)
      provider: "gemini"
      model_name: "gemini-3.5-flash-lite"
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "GEMINI_API_KEY"
      max_new_tokens: 1024
      temperature: 0.1
    groq:                            # gecici TEST backend'i (harici API — offline degildir); Gemini kotasindan
                                      # BAGIMSIZ ayri bir kota (OpenAI-uyumlu uc, ayni LLMClient/ChatOpenAI sarmalayicisi)
      provider: "groq"
      model_name: "qwen/qwen3.6-27b"
      base_url: "https://api.groq.com/openai/v1"
      api_key_env: "GROQ_API_KEY"
      # NOT: qwen3.6-27b muhtemelen varsayilan "thinking" modda (yerel qwen3
      # yukarida BILEREK "non-thinking" surumu secilmisti, ayni sebep). 1024
      # token, dusunme adimlari + JSON ciktisi icin YETERSIZ kalip bos/
      # gecersiz JSON'a (Groq 400 json_validate_failed, bos failed_generation)
      # yol acabiliyordu - bu yuzden buraya ozel, digerlerinden daha genis.
      max_new_tokens: 4096
      temperature: 0.1

agent:
  max_iterations: 6                  # LangGraph durum makinesinin maksimum dongu sayisi
  guided_json: true                  # Ajan ciktisi bozuk JSON ise JSON-modu ile 1 kez yeniden dene (vLLM/Gemini)
  risk_thresholds:
    low: 25                          # 0-25       -> dusuk risk
    medium: 50                       # 26-50      -> orta risk
    high: 75                         # 51-75      -> yuksek risk
    critical: 100                    # 76-100     -> kritik risk
  tools:
    sql_tool_enabled: true
    rag_tool_enabled: true
    retriever_tool_enabled: true
    timeline_tool_enabled: true
    verification_tool_enabled: true

# -----------------------------------------------------------------------------
# Otomatik Eskalasyon (Human-on-the-Loop) - bloke edici operator kapisi YOK
# -----------------------------------------------------------------------------
# Sistem, risk skoruna gore aksiyon kademesini kendisi belirler:
#   skor >= notify_score      -> bildirim (NOTIFY)
#   skor >= auto_alarm_score  -> saha alarmi OTOMATIK tetiklenir (ALARM)
# Operator, alarmi ENGELLEMEK icin degil; sonradan DENETLEMEK/GERI ALMAK icin
# devrededir (bkz. /alerts/{alert_id}/acknowledge).
escalation:
  notify_score: 26                   # orta ve uzeri -> bildirim
  auto_alarm_score: 51               # yuksek/kritik -> otomatik saha alarmi

# -----------------------------------------------------------------------------
# Guvenlik - Prompt Injection Guard
# -----------------------------------------------------------------------------
# Agent'a giden guvenilmeyen serbest metni (user_prompt, VLM aciklamasi)
# talimat olarak yorumlanmaya karsi kontrol eder. risk_score/risk_level/
# event_type/RuleEngine/RAG kararlarina DOKUNMAZ (bkz. src/security/
# prompt_injection_guard.py modul dokustringi). embedding/reranker ile AYNI
# Gemini API anahtarini kullanir.
# NOT (varsayilan KAPALI): reranker'in aksine (yalnizca RAG sonucunu bos
# birakir - `stage_context` icinde try/except ile yutulur), guard basarisiz
# oldugunda fail_closed=true politikasi vlm_description/user_prompt metnini
# GORUNUR sekilde quarantine ile isaretler. GEMINI_API_KEY tanimli DEGILSE
# (orn. CI/test ortami) bu her cagrida tetiklenir - bu yuzden guard,
# GEMINI_API_KEY provizyonlanip dogrulandiktan SONRA acikca enabled:true
# yapilmalidir (production).
guard:
  enabled: true
  provider: "groq"                   # reranker'dan da AYRI bir Groq modeli/kotasi (guvenlik-siniflandirmasina uygun isim)
  model_name: "openai/gpt-oss-safeguard-20b"
  fail_closed: true                  # true: guard API/parse hatasinda icerik QUARANTINE edilir (production)
  confidence_threshold: 0.80         # is_injection=true VE confidence >= bu deger -> quarantine
  base_url: "https://api.groq.com/openai/v1"
  api_key_env: "GROQ_API_KEY"

# -----------------------------------------------------------------------------
# API / Servis Katmani
# -----------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  cors_origins:
    - "*"

# -----------------------------------------------------------------------------
# 06 - Cikti ve Karar Destek Katmani
# -----------------------------------------------------------------------------
output:
  language: "tr"
  json_report_dir: "outputs/reports"
  timeline_export_dir: "outputs/timelines"
  pdf_report_dir: "outputs/pdf"
  streamlit_port: 8501
