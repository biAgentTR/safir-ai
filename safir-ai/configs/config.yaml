# =============================================================================
# SAFIR - Saha Analiz ve Farkindalik Icin Yapay Zeka Destekli Karar Sistemi
# Merkezi Konfigurasyon Dosyasi
#
# Bu dosya, mimarinin tum katmanlarinin (Adaptive Sampler, VLM, LLM/Agent,
# API/vLLM servisleri) davranisini tek bir noktadan yonetir.
# =============================================================================

system:
  name: "SAFIR"
  environment: "production"          # development | staging | production
  device: "cuda"                     # cuda | cpu
  cuda_device_index: 0
  log_level: "INFO"
  random_seed: 42

# -----------------------------------------------------------------------------
# 02 - VLM Oncesi Katman (Adaptive Frame Sampler) - CPU ONLY
# -----------------------------------------------------------------------------
sampler:
  min_change_threshold: 0.011        # Kanit Karesi sayilmasi icin gurultu-tabani-dusulmus min degisim orani
  blur_kernel_size: [21, 21]         # Gauss bulaniklastirma cekirdek boyutu (tek sayilar)
  history_window: 30                 # Dinamik gurultu tabani (medyan) icin tutulan kare gecmisi
  min_event_interval_sec: 2.0        # Ardisik kareleri ayni Olay Grubuna dahil etme zaman araligi (sn)
  sample_fps: 5                      # Videonun kac saniyede bir kare kontrol edilecegini belirleyen hiz

# -----------------------------------------------------------------------------
# 03 - Gorsel Dil Modeli (VLM) Katmani - GPU / vLLM
# -----------------------------------------------------------------------------
vlm:
  active_model: "qwen"               # qwen | gemma  (VLMFactory tarafindan okunur)
  models:
    qwen:
      model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
      vllm_host: "0.0.0.0"
      vllm_port: 8001
      max_new_tokens: 512
      temperature: 0.2
      top_p: 0.9
    gemma:
      model_name: "google/gemma-3-vision-instruct"
      vllm_host: "0.0.0.0"
      vllm_port: 8002
      max_new_tokens: 512
      temperature: 0.2
      top_p: 0.9

# -----------------------------------------------------------------------------
# 04 - Hibrit Bellek ve Baglam Olusturucu - CPU ONLY
# -----------------------------------------------------------------------------
memory:
  sqlite:
    db_path: "data/events.db"
  embedding:
    provider: "sentence-transformers"
    model_name: "BAAI/bge-m3"          # alternatif: "Qwen/Qwen3-VL-Embedding"
    device: "cpu"                      # RAG embedding hesaplama CPU'da yapilir, GPU'yu VLM/LLM'e ayirir
    normalize_embeddings: true
  faiss:
    index_path: "data/faiss_index"
    top_k: 5

# -----------------------------------------------------------------------------
# 05 - Ajan ve Muhakeme Katmani (LangGraph) - GPU / vLLM
# -----------------------------------------------------------------------------
llm:
  active_model: "qwen3"              # qwen3 | gemma3 (VLM'den bagimsiz saf muhakeme modeli)
  models:
    qwen3:
      model_name: "Qwen/Qwen3-8B-Instruct"
      vllm_host: "0.0.0.0"
      vllm_port: 8003
      max_new_tokens: 1024
      temperature: 0.1
    gemma3:
      model_name: "google/gemma-3-8b-it"
      vllm_host: "0.0.0.0"
      vllm_port: 8004
      max_new_tokens: 1024
      temperature: 0.1

agent:
  max_iterations: 6                  # LangGraph durum makinesinin maksimum dongu sayisi
  risk_thresholds:
    low: 25                          # 0-25       -> dusuk risk
    medium: 50                       # 26-50      -> orta risk
    high: 75                         # 51-75      -> yuksek risk
    critical: 100                    # 76-100     -> kritik risk
  tools:
    sql_tool_enabled: true
    retriever_tool_enabled: true
    timeline_tool_enabled: true

# -----------------------------------------------------------------------------
# API / Servis Katmani
# -----------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  cors_origins:
    - "*"

# -----------------------------------------------------------------------------
# 06 - Cikti ve Karar Destek Katmani
# -----------------------------------------------------------------------------
output:
  language: "tr"
  json_report_dir: "outputs/reports"
  timeline_export_dir: "outputs/timelines"
  pdf_report_dir: "outputs/pdf"
  streamlit_port: 8501
