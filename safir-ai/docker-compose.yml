# =============================================================================
# SAFIR - Docker Compose orkestrasyonu (OPSIYONEL / LEGACY)
#
# NOT: Standart deployment modeli artik NATIVE'dir (Docker'siz): VM -> Python
# venv -> `pip install -r requirements.txt` -> `vllm serve` (x2) -> `uvicorn`.
# Bkz. KURULUM.md ve README.md "Kurulum (native)". Bu dosya Docker/Compose
# tercih edenler icin ALTERNATIF olarak birakilmistir; native kurulum bu
# dosyaya BAGIMLI DEGILDIR.
#
# safir-api: hafif CPU (sampler) + ajan orkestrasyonu (FastAPI)
# vllm-vlm : Gorsel Dil Modeli servisi (GPU)
# vllm-llm : Saf muhakeme/ajan LLM servisi (GPU)
# =============================================================================
version: "3.9"

services:
  safir-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: safir-ai:latest
    container_name: safir-api
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - SAFIR_ENV=production
      - VLM_ENDPOINT=http://vllm-vlm:8001/v1
      - LLM_ENDPOINT=http://vllm-llm:8003/v1
    depends_on:
      - vllm-vlm
      - vllm-llm
    restart: unless-stopped
    networks:
      - safir-net

  safir-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: safir-dashboard:latest
    container_name: safir-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    environment:
      - SAFIR_API_URL=http://safir-api:8000
      - SAFIR_DATA_DIR=/app/data
    depends_on:
      - safir-api
    restart: unless-stopped
    networks:
      - safir-net

  # VLM servisi — Qwen2.5-VL-7B-Instruct, RTX 5090 (Blackwell/sm_120) icin FP8.
  # NOT: Blackwell CUDA 12.8 gerektirir; imaj Blackwell-uyumlu guncel bir tag olmali
  # (asagidaki tag calismazsa `sm_120`/CUDA hatasinda daha guncel bir tag'e cikin).
  # Tek 5090'da iki vLLM ayni GPU'yu paylasir: util 0.50 (VLM) + 0.30 (LLM) = 0.80.
  vllm-vlm:
    image: vllm/vllm-openai:v0.10.2
    container_name: safir-vllm-vlm
    command:
      - "--model"
      - "Qwen/Qwen2.5-VL-7B-Instruct"
      - "--port"
      - "8001"
      - "--trust-remote-code"
      - "--quantization"
      - "fp8"                       # Blackwell-native 8-bit (harici AWQ checkpoint gerekmez); ~8.3 GB agirlik
      - "--dtype"
      - "bfloat16"
      - "--gpu-memory-utilization"
      - "0.50"
      - "--max-model-len"
      - "8192"                      # metin + ~3-9 temsili kare gorsel token + cikti
      - "--limit-mm-per-prompt"
      - "image=12"                  # istem basina maksimum kare (multimodal aktivasyonu sinirlar)
      - "--max-num-seqs"
      - "2"
    ports:
      - "8001:8001"
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=0
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - safir-net

  # LLM (saf muhakeme/ajan) servisi — Qwen2.5-3B-Instruct, BF16 (~6.2 GB agirlik).
  vllm-llm:
    image: vllm/vllm-openai:v0.10.2
    container_name: safir-vllm-llm
    command:
      - "--model"
      - "Qwen/Qwen2.5-3B-Instruct"
      - "--port"
      - "8003"
      - "--trust-remote-code"
      - "--dtype"
      - "bfloat16"
      - "--gpu-memory-utilization"
      - "0.30"
      - "--max-model-len"
      - "4096"
      - "--max-num-seqs"
      - "4"
    ports:
      - "8003:8003"
    environment:
      - HF_HUB_ENABLE_HF_TRANSFER=0
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - safir-net

volumes:
  hf-cache:

networks:
  safir-net:
    driver: bridge
