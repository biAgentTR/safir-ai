# =============================================================================
# SAFIR - Docker Compose orkestrasyonu
# safir-api: hafif CPU (sampler) + ajan orkestrasyonu (FastAPI)
# vllm-vlm : Gorsel Dil Modeli servisi (GPU)
# vllm-llm : Saf muhakeme/ajan LLM servisi (GPU)
# =============================================================================
version: "3.9"

services:
  safir-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: safir-ai:latest
    container_name: safir-api
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - safir-data:/app/data
      - safir-outputs:/app/outputs
    environment:
      - SAFIR_ENV=production
    depends_on:
      - vllm-vlm
      - vllm-llm
    restart: unless-stopped
    networks:
      - safir-net

  vllm-vlm:
    image: vllm/vllm-openai:v0.5.4
    container_name: safir-vllm-vlm
    command:
      - "--model"
      - "Qwen/Qwen2.5-VL-7B-Instruct"
      - "--port"
      - "8001"
      - "--trust-remote-code"
    ports:
      - "8001:8001"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - safir-net

  vllm-llm:
    image: vllm/vllm-openai:v0.5.4
    container_name: safir-vllm-llm
    command:
      - "--model"
      - "Qwen/Qwen3-8B-Instruct"
      - "--port"
      - "8003"
      - "--trust-remote-code"
    ports:
      - "8003:8003"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - safir-net

volumes:
  safir-data:
  safir-outputs:
  hf-cache:

networks:
  safir-net:
    driver: bridge
