# onceki audit raporu "GAPS" bolumu) - knowledge base'e dahil EDILMEDI:
#   - Dar/kapali alan calismasi: Turkiye'de bagimsiz bir yonetmelik yok;
#     yalnizca isg_kanunu_6331 + risk_degerlendirmesi_yonetmeligi genel
#     cercevesi kapsiyor.
#   - LOTO (kilitleme/etiketleme): bagimsiz yonetmelik yok; yalnizca
#     is_ekipmanlari_yonetmeligi'nin bakim/enerji-kesme hukumleri dolayli
#     kapsiyor.
#   - Forklift-yaya gecidi / "unauthorized_presence_in_critical_area":
