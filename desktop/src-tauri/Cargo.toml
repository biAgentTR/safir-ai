[package]
name = "safir-desktop"
version = "0.1.0"
description = "SAFIR desktop application (Tauri 2 shell for the Nuxt frontend)."
authors = ["SAFIR"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "safir_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# used by tauri when bundling with a custom protocol
custom-protocol = ["tauri/custom-protocol"]
